<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>회원가입</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>

<body>

  <div class="background-overlay"></div>

  <div class="container">

    <div class="left-panel">

      <div class="logo-box">

        <h1>ODIRU</h1>

        <p>
          새로운 여행을<br>
          시작해보세요.
        </p>

      </div>

    </div>

    <div class="right-panel">

      <button
        class="back-btn"
        onclick="history.back()"
      >
        ← 뒤로가기
      </button>

      <div class="auth-box">

        <h2>카카오 회원가입</h2>

        <p class="sub-text">
          카카오 계정 하나로<br>
          바로 가입할 수 있어요
        </p>

        <button
          class="kakao-btn"
          onclick="location.href='/auth/kakao'"
        >
          <img
            src="https://cdn-icons-png.flaticon.com/512/4494/4494622.png"
          >

          카카오로 회원가입
        </button>

      </div>

    </div>

  </div>

  <script src="./js/script.js"></script>

</body>
</html>
