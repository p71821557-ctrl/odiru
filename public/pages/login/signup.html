<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>어디루 회원가입</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <section class="signup-page">

    <div class="login-container">

      <h1>회원가입</h1>

      <input
        type="text"
        id="nickname"
        placeholder="닉네임"
      >

      <input
        type="email"
        id="email"
        placeholder="이메일"
      >

      <input
        type="password"
        id="password"
        placeholder="비밀번호"
      >

      <button id="signup-btn">
        회원가입
      </button>

      <button id="back-home">
        홈으로 돌아가기
      </button>

    </div>

  </section>

  <script src="script.js"></script>

</body>

</html>
