<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="container">

    <div class="auth-box">

      <h1>로그인</h1>

      <form class="auth-form">

        <input
          type="email"
          placeholder="이메일"
          required
        >

        <input
          type="password"
          placeholder="비밀번호"
          required
        >

        <button
          type="submit"
          class="main-btn"
        >
          로그인
        </button>

      </form>

      <div class="divider">
        <span>또는</span>
      </div>

      <div class="social-login">

        <button
          type="button"
          class="google-btn"
        >
          Google 로그인
        </button>

        <button
          type="button"
          class="kakao-btn"
        >
          Kakao 로그인
        </button>

      </div>

      <p class="move-page">
        계정이 없으신가요?
        <a href="./signup.html">
          회원가입
        </a>
      </p>

    </div>

  </div>

  <script src="./js/script.js"></script>
</body>
</html>
