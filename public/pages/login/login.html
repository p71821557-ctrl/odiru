<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>어디루 로그인</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <section class="login-page">

    <div class="login-container">

      <h1>어디루 로그인</h1>

      <input
        type="email"
        id="login-email"
        placeholder="이메일 입력"
      >

      <input
        type="password"
        id="login-password"
        placeholder="비밀번호 입력"
      >

      <button id="login-submit">
        로그인
      </button>

      <button id="back-home">
        홈으로 돌아가기
      </button>

    </div>

  </section>

  <script src="script.js"></script>

</body>

</html>
