<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ODIRU LOGIN</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>

<body>

  <div class="background-overlay"></div>

  <div class="container">

    <!-- 왼쪽 -->
    <div class="left-panel">

      <div class="logo-box">

        <h1>ODIRU</h1>

        <p>
          당신만의 여행을<br>
          더 특별하게.
        </p>

      </div>

    </div>

    <!-- 오른쪽 -->
    <div class="right-panel">

      <button
        class="back-btn"
        onclick="history.back()"
      >
        ← 뒤로가기
      </button>

      <div class="auth-box">

        <h2>카카오 로그인</h2>

        <p class="sub-text">
          카카오 계정으로<br>
          간편하게 시작하세요
        </p>

        <button
          class="kakao-btn"
          onclick="location.href='/auth/kakao'"
        >
          <img
            src="https://cdn-icons-png.flaticon.com/512/4494/4494622.png"
          >

          카카오로 시작하기
        </button>

      </div>

    </div>

  </div>

  <script src="./js/script.js"></script>

</body>
</html>
