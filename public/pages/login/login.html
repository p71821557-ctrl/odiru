<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Odiru Login</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <!-- 배경 -->
  <div class="background-overlay"></div>

  <div class="container">

    <!-- 왼쪽 -->
    <div class="left-panel">

      <div class="logo-box">
        <h1>ODIRU</h1>

        <p>
          당신만의 여행을<br>
          더 특별하게.
        </p>
      </div>

    </div>

    <!-- 오른쪽 -->
    <div class="right-panel">

      <div class="auth-box">

        <h2>로그인</h2>

        <p class="sub-text">
          카카오 계정으로 간편하게 로그인하세요
        </p>

        <button
          class="kakao-btn"
          onclick="location.href='/auth/kakao'"
        >
          <img
            src="https://cdn-icons-png.flaticon.com/512/4494/4494622.png"
          >

          카카오로 시작하기
        </button>

        <div class="divider">
          <span>OR</span>
        </div>

        <form class="auth-form">

          <input
            type="email"
            placeholder="이메일"
          >

          <input
            type="password"
            placeholder="비밀번호"
          >

          <button
            type="submit"
            class="main-btn"
          >
            로그인
          </button>

        </form>

        <p class="move-page">
          계정이 없으신가요?
          <a href="./signup.html">
            회원가입
          </a>
        </p>

      </div>

    </div>

  </div>

  <script src="./js/script.js"></script>

</body>
</html>
