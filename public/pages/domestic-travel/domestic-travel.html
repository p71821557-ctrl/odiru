<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>어디루 - 국내여행지 선택</title>
  <link rel="stylesheet" href="css/domestic-travel.css">
  <script type="text/javascript"
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=8c7c498db86403ba673ecdce2316c007&libraries=services">
  </script>
</head>
<body>

  <header class="header">
    <div class="logo-area">
      <a href="../../index.html">
        <img src="images/odiru.png" alt="어디루 로고" />
      </a>
    </div>
    <nav class="nav">
      <a href="domestic-travel.html">국내여행</a>
      <a href="#">숙소예약</a>
      <a href="#">여행코스</a>
    </nav>
    <div class="header-buttons">
      <button id="mypage-btn">마이페이지</button>
      <button id="login-btn">로그인</button>
      <button id="signup-btn">회원가입</button>
      <button id="logout-btn" style="display:none;">로그아웃</button>
    </div>
  </header>

  <section class="hero-banner">
    <div class="hero-content">
      <h1>국내 어디든 떠나보세요</h1>
      <p>쉽고 빠르게 국내여행을 계획하고<br>감성 여행지를 탐험해보세요.</p>
    </div>
  </section>

  <div class="content-container">

    <div class="section-header">
      <div class="section-title">여행지 선택</div>
    </div>
    <div class="travel-grid">
      <div class="place-card">
        <img src="images/busan.jpg" alt="부산">
        <div class="place-name">부산</div>
      </div>
      <div class="place-card">
        <img src="images/gwangju.jpg" alt="광주">
        <div class="place-name">광주</div>
      </div>
      <div class="place-card">
        <img src="images/Seoul.jpg" alt="서울">
        <div class="place-name">서울</div>
      </div>
      <div class="place-card">
        <img src="images/Jeonju.jpg" alt="전주">
        <div class="place-name">전주</div>
      </div>
    </div>

    <div class="section-header">
      <div class="section-title">카테고리 선택 (중복 선택 가능)</div>
    </div>
    <div class="category-grid">
      <button class="cat-btn">문화</button>
      <button class="cat-btn">관광</button>
      <button class="cat-btn">힐링</button>
      <button class="cat-btn">자연</button>
      <button class="cat-btn">체험</button>
      <button class="cat-btn">커플</button>
      <button class="cat-btn">가족</button>
      <button class="cat-btn">쇼핑</button>
    </div>

    <div class="footer-area">
      <button class="btn-complete" id="submitBtn">선택 완료</button>
    </div>

    <!-- 추천 결과 카드 -->
    <div id="recommend-result" class="recommend-section" style="display: none;">
      <div class="section-header">
        <div class="section-title">🔮 이런 여행지는 어떠세요?</div>
      </div>
      <div class="recommend-grid" id="recommendGrid"></div>
    </div>

    <!-- 코스 지도 패널 -->
    <div id="course-panel">
      <div class="course-panel-header">
        <div>
          <h3>📍 추천 여행 코스</h3>
          <div id="course-title"></div>
        </div>
        <button id="close-course-panel" title="닫기">✕</button>
      </div>
      <div class="course-body">
        <div id="course-map"></div>
        <div class="course-sidebar" id="course-sidebar"></div>
      </div>
    </div>

  </div>

  <script src="js/domestic-travel.js"></script>
</body>
</html>
