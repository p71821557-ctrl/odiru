<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    어디루 - 국내여행지 선택
  </title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="/pages/domestic-travel/css/domestic-travel.css"
  />

</head>

<body>

  <!-- HEADER -->

  <header class="header">

    <div class="logo-area">

      <a href="/">

        <img
          src="/images/odiru.png"
          alt="어디루 로고"
        />

      </a>

    </div>

    <nav class="nav">

      <a href="/pages/domestic-travel/domestic-travel.html">
        국내여행
      </a>

      <a href="#">
        숙소예약
      </a>

      <a href="#">
        여행코스
      </a>

    </nav>

    <div class="header-buttons">

      <button id="mypage-btn">
        마이페이지
      </button>

      <button id="login-btn">
        로그인
      </button>

      <button id="signup-btn">
        회원가입
      </button>

      <button
        id="logout-btn"
        style="display:none;"
      >
        로그아웃
      </button>

    </div>

  </header>

  <!-- CONTENT -->

  <div class="content-container">

    <div class="section-header">

      <div class="section-title">
        여행지 선택
      </div>

    </div>

    <div class="travel-grid">

      <div class="place-card">

        <img
          src="/pages/domestic-travel/images/busan.jpg"
          alt="부산"
        />

        <div class="place-name">
          부산
        </div>

      </div>

      <div class="place-card">

        <img
          src="/pages/domestic-travel/images/gwangju.jpg"
          alt="광주"
        />

        <div class="place-name">
          광주
        </div>

      </div>

      <div class="place-card">

        <img
          src="/pages/domestic-travel/images/seoul.jpg"
          alt="서울"
        />

        <div class="place-name">
          서울
        </div>

      </div>

      <div class="place-card">

        <img
          src="/pages/domestic-travel/images/jeonju.jpg"
          alt="전주"
        />

        <div class="place-name">
          전주
        </div>

      </div>

    </div>

    <div class="section-header">

      <div class="section-title">
        카테고리 선택 (중복 선택 가능)
      </div>

    </div>

    <div class="category-grid">

      <button class="cat-btn">문화</button>
      <button class="cat-btn">관광</button>
      <button class="cat-btn">놀이공원</button>
      <button class="cat-btn">힐링</button>
      <button class="cat-btn">자연</button>
      <button class="cat-btn">체험</button>
      <button class="cat-btn">커플</button>
      <button class="cat-btn">가족</button>
      <button class="cat-btn">바다</button>

    </div>

    <div class="footer-area">

      <button
        class="btn-complete"
        id="submitBtn"
      >

        선택 완료

      </button>

    </div>

  </div>

  <!-- JS -->
  <script src="/pages/domestic-travel/js/domestic-travel.js"></script>

</body>

</html>
