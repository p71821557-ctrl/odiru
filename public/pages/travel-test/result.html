<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    여행 성향 결과
  </title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="/pages/travel-test/css/travel-test.css"
  />

</head>

<body>

  <section class="test-page">

    <div class="test-container">

      <div class="result-card">

        <div class="result-badge">
          여행 성향 결과
        </div>

        <h1
          class="result-title"
          id="result-type"
        >
        </h1>

        <div
          class="mbti-code"
          id="result-mbti"
        >
        </div>

        <p
          class="result-desc"
          id="result-desc"
        >
        </p>

        <h3>
          ✈ 추천 여행지
        </h3>

        <div
          class="travel-list"
          id="recommend-list"
        >
        </div>

        <div class="result-detail">

          <h3>
            📌 당신의 선택
          </h3>

          <p id="result-choice">
          </p>

        </div>

        <div class="result-buttons">

          <button id="retry-btn">
            다시 테스트하기
          </button>

          <button id="main-btn">
            메인으로 가기
          </button>

        </div>

      </div>

    </div>

  </section>

  <!-- JS -->
  <script src="/pages/travel-test/js/result.js"></script>

</body>

</html>
