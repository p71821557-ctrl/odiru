<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>어디루 - 국내여행 플랫폼</title>
  <link rel="stylesheet" href="/css/style.css" />

  <!-- 카카오맵 SDK -->
  <script type="text/javascript"
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=8c7c498db86403ba673ecdce2316c007&libraries=services">
    </script>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo-area">
      <a href="/"><img src="/images/odiru.png" alt="어디루 로고" /></a>
    </div>

    <nav class="nav">
      <a href="/pages/domestic-travel/domestic-travel.html">국내여행</a>
      <a href="#">숙소예약</a>
      <a href="#">여행코스</a>
    </nav>

    <div class="hero-buttons">
      <button id="hero-login-btn">로그인</button>
    </div>
  </header>


  <!-- HERO -->
  <section class="hero-section">
    <div class="hero-slider">
      <div class="slide active">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1920" alt="여행 이미지 1" />
      </div>
      <div class="slide">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=1920" alt="여행 이미지 2" />
      </div>
      <div class="slide">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1920" alt="여행 이미지 3" />
      </div>
    </div>

    <div class="overlay"></div>

    <div class="hero-content">
      <h1 id="hero-title">국내 어디든 떠나보세요</h1>
      <p>쉽고 빠르게 국내여행을 계획하고<br />감성 여행지를 탐험해보세요.</p>
      <div class="hero-buttons">
        <button id="hero-login-btn">로그인</button>
        <button id="hero-signup-btn">회원가입</button>
      </div>
    </div>
  </section>


  <!-- MAP & PLANNER -->
  <!-- ★ section 태그 대신 div 사용 → 공통 section CSS(width:90%) 영향 안 받음 -->
  <div class="map-section">
    <div class="section-title">
      <h2>여행 플래너</h2>
      <p>출발지와 도착지를 기반으로 여행 동선을 확인하세요.</p>
    </div>

    <div class="planner-container">

      <!-- 카카오맵 -->
      <div id="map"></div>

      <!-- 패널 -->
      <div class="planner-panel">
        <h3>여행 경로 설정</h3>

        <div class="planner-input">
          <label>출발지</label>
          <input type="text" id="start-place" placeholder="예: 서울역" />
        </div>

        <div class="planner-input">
          <label>도착지</label>
          <input type="text" id="end-place" placeholder="예: 부산 해운대" />
        </div>

        <button id="route-btn">여행 경로 확인</button>

        <div id="route-info"></div>

        <div class="planner-games">
          <a href="/pages/lucky-ball/lucky-ball.html" class="planner-game-card">
            🎱 행운볼 뽑기
          </a>
          <a href="/pages/travel-test/travel-test.html" class="planner-game-card">
            ✈️ 여행 성향 테스트
          </a>
        </div>
      </div>

    </div>
  </div>


  <!-- FOOTER -->
  <footer>
    <p>© 2026 Odiro ALL RIGHTS RESERVED</p>
  </footer>

  <script src="/js/script.js"></script>
</body>

</html>
